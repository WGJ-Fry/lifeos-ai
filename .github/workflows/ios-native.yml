name: iOS Native Compile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "native/apple/mobile-shell/**"
      - "scripts/build-ios-mobile-shell.mjs"
      - "tests/apple-mobile-native-shell.test.mjs"
      - "package.json"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "native/apple/mobile-shell/**"
      - "scripts/build-ios-mobile-shell.mjs"
      - "tests/apple-mobile-native-shell.test.mjs"
      - "package.json"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate native contracts
        run: npm run test:apple-native

      - name: Run native XCTest suite
        run: npm run test:apple-native:xcode

      - name: Compile unsigned iPhoneOS target
        run: npm run mobile:native:device:compile
